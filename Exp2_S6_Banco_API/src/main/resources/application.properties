server.port=8081
spring.application.name=banco-xyz

# Import configuration from Config Server
spring.config.import=configserver:http://config-server:8888

# Eureka client configuration
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# Kafka producer configuration
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.topic.transferencias=banco-xyz.transferencias

# Expose actuator endpoints for verification
management.endpoints.web.exposure.include=*

# Configuración de OAuth 2.0 Resource Server con clave secreta simétrica para validación JWT local
spring.security.oauth2.resourceserver.jwt.secret-key=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.AbCdEfGhIjKlMnOpQrStUvWxYz0123456789

# Configuración formal de Resilience4j para el Circuit Breaker de Kafka
resilience4j.circuitbreaker.instances.kafkaService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.kafkaService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.kafkaService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.kafkaService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.kafkaService.automaticTransitionFromOpenToHalfOpenEnabled=true